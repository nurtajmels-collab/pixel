services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - PERSONAL_AUTH=${PERSONAL_AUTH:-true}
      - DB_PATH=/data/pixellife.db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - pixellife_data:/data
    restart: unless-stopped

volumes:
  pixellife_data: